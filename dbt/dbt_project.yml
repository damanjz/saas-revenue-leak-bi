name: revenue_leak
version: "1.0.0"
config-version: 2
profile: revenue_leak

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "logs"]

vars:
  analysis_start_date: "2024-10-01"
  analysis_end_date: "2026-09-30"

models:
  revenue_leak:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      metrics:
        +schema: metrics

seeds:
  revenue_leak:
    +schema: reference

data_tests:
  +store_failures: false
